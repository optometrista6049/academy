<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="handGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="handCuff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Ondas sutiles de agarre sobre los dedos -->
  <g fill="none" stroke="#fde68a" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <path d="M162 82 C192 52, 232 46, 268 54" />
    <path d="M350 96 C382 118, 398 152, 396 186" />
  </g>

  <!-- Mano abierta estilizada en gesto de recoger -->
  <g stroke="#1a1105" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- Puño / muñeca inferior -->
    <rect x="166" y="394" width="164" height="68" rx="22" fill="url(#handCuff)" />

    <!-- Palma + 5 dedos articulados recogiendo -->
    <path d="
      M180 394
      L154 316
      C136 286, 98 256, 86 232
      C76 212, 92 186, 118 194
      C138 200, 158 228, 174 252
      L164 136
      C162 112, 180 96, 198 98
      C216 100, 226 118, 228 140
      L234 218
      L238 106
      C238 82, 256 68, 274 70
      C292 72, 304 90, 304 114
      L300 218
      L318 128
      C324 106, 342 96, 358 102
      C376 108, 384 128, 378 150
      L356 238
      L378 176
      C386 156, 404 150, 418 158
      C434 168, 438 188, 428 210
      L384 314
      C368 352, 344 374, 316 394
      Z"
      fill="url(#handGold)"
    />
  </g>

  <!-- Brillo suave en la palma y articulaciones -->
  <path d="M206 278 C226 254, 276 250, 310 270" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round" opacity="0.7" />
  <circle cx="248" cy="428" r="10" fill="#e0f2fe" stroke="#1a1105" stroke-width="6" />
</svg>
