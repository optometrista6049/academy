<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Preview UI Assets</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .item { border: 1px solid #444; border-radius: 8px; padding: 10px; background: #222; }
        img { max-width: 100%; height: auto; border: 1px solid #555; display: block; }
        h3 { margin-top: 0; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>Verificación de Imágenes UI</h1>
    <div class="grid">
        <div class="item">
            <h3>mainmenu.jpg</h3>
            <img src="/assets/ui/mainmenu.jpg" alt="mainmenu">
        </div>
        <div class="item">
            <h3>controls.jpg</h3>
            <img src="/assets/ui/controls.jpg" alt="controls">
        </div>
        <div class="item">
            <h3>controls11.jpg</h3>
            <img src="/assets/ui/controls11.jpg" alt="controls11">
        </div>
        <div class="item">
            <h3>credits.jpg</h3>
            <img src="/assets/ui/credits.jpg" alt="credits">
        </div>
        <div class="item">
            <h3>credits11.jpg</h3>
            <img src="/assets/ui/credits11.jpg" alt="credits11">
        </div>
    </div>
</body>
</html>
